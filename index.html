<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Attic Calendar</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header id="header">
        <div id="logo">
            <h1>Attic Calendar</h1>
        </div>
    </header>
            
    <main>
        <div class="innertube">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button class="nav-btn" id="prevMonth">◀</button>
                    <h2 id="monthTitle">Hekatombaion</h2>
                    <button class="nav-btn" id="nextMonth">▶</button>
                </div>

                <div class="selected-info">
                    <div class="date-display">
                        <span id="selectedDate">Selecciona un día</span>
                    </div>
                    <div class="phase-display">
                        <span class="phase-icon" id="selectedPhaseIcon">🌒</span>
                        <div class="phase-details">
                            <div class="phase-name" id="selectedPhaseName">Luna Creciente</div>
                            <div class="phase-sub"></div>
                        </div>
                    </div>
                </div>

                <div class="weekdays">
                    <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div>
                    <div>Jue</div><div>Vie</div><div>Sáb</div>
                </div>

                <div class="days-grid" id="daysGrid"></div>

                <div class="footer-info">
                    <div>Month <span id="monthNumber" class="highlight">1</span>/12</div>
                </div>
            </div>

        </div>
    </main>

    <nav id="nav">
        <div class="innertube">
            <h1>Resources:</h1>
            <ul>
                <li><a href="https://www.hellenion.org" target="_blank">Hellenion</a></li>
            </ul>
            <hr style="border-color:#3d1f6e;">
            <div><small>If there are any issues or innacuracies, let us know!</small></div>
            <ul>
                <li><a href="https://discord.gg/jq4zEtCnBT" target="_blank">Our Discord</a></li>
            </ul>
        </div>
    </nav>

    <script src="funcionesc.js"></script>
    
    <script>
        // Esperar a que el DOM esté cargado
        document.addEventListener('DOMContentLoaded', function() {
            initCalendar();
        });

        // Función para actualizar el año en la barra lateral
        function updateYearDisplay() {
            const yearEl = document.getElementById('yearDisplay');
            if (yearEl) {
                yearEl.textContent = currentYear || 1;
            }
        }

        // Sobrescribir funciones de navegación para actualizar el año
        const originalPrev = goToPrevMonth;
        const originalNext = goToNextMonth;
        
        goToPrevMonth = function() {
            originalPrev();
            updateYearDisplay();
        };
        
        goToNextMonth = function() {
            originalNext();
            updateYearDisplay();
        };

        // Actualizar año después de renderizar
        const originalRender = renderCalendar;
        renderCalendar = function() {
            originalRender();
            updateYearDisplay();
        };

    </script>
</body>
</html>
