<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Attic Calendar</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%; 
            max-height: 100%; 
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.5em;
        }
        .container{
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px; 
            color: bisque;
            overflow: hidden;
            background: #080010;
        }
        
        #nav {
            position: absolute; 
            top: 100px; 
            left: 0; 
            bottom: 0;
            width: 230px;
            color: bisque;
            overflow: auto;
            background: #0f011e;         
        }
        
        #logo {
            padding: 10px;
        }
        
        main {
            position: fixed;
            top: 100px;
            left: 230px; 
            right: 0;
            bottom: 0;
            overflow: auto; 
            background: #0f041b;
            background-image: url(background.jpg);
            background-size: 400px auto;
            color: rgb(254, 222, 116);
        }
        
        .innertube {
            margin: 15px;
        }
        
        p {
            color: #fefdfd;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        
        nav ul a {
            color: rgb(254, 222, 116);
            text-decoration: none;
        }
                
        /* IE6 fix */
        * html body{
            padding: 100px 0 0 230px;
        }
        
        * html main{ 
            height: 100%; 
            width: 100%; 
        }

        /* ===== ESTILOS DEL CALENDARIO ===== */
        .calendar-container {
            max-width: 380px;
            margin: 10px 0 10px 30px;;
            background: #1a0a2e;
            color: #fefdfd;
            border: 1px solid #3d1f6e;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            padding: 0.8rem 1rem;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .calendar-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: #fefdfd;
            min-width: 130px;
            text-align: center;
        }

        .nav-btn {
            background: none;
            border: 1px solid #3d1f6e;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #fefdfd;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #2a1040;
        }

        .selected-info {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 12px;
            background: #0f041b;
            border-radius: 12px;
            border: 1px solid #3d1f6e;
        }

        .selected-info .date-display {
            font-size: 0.85rem;
            color: #b8a6d4;
        }

        .selected-info .date-display span {
            color: #fbbf24;
            font-weight: 600;
        }

        .selected-info .phase-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .selected-info .phase-icon {
            font-size: 2.2rem;
        }

        .selected-info .phase-details {
            text-align: left;
        }

        .selected-info .phase-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fbbf24;
        }

        .selected-info .phase-sub {
            font-size: 0.8rem;
            color: #b8a6d4;
        }

        .selected-info .phase-sub span {
            color: #b8a6d4;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.7rem;
            color: #b8a6d4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .days-grid .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            background: #0f041b;
            position: relative;
        }

        .days-grid .day-cell.empty {
            background: transparent;
            color: transparent;
            cursor: default;
        }

        .days-grid .day-cell.weekend {
            color: #64748b;
        }

        .days-grid .day-cell.today {
            background: #fbbf24;
            color: #0f172a;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
        }

        .days-grid .day-cell.today .mini-moon {
            color: #0f172a;
        }

        .days-grid .day-cell.selected {
            background: #fbbf24;
            color: #0f172a;
            font-weight: 700;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.25);
            transform: scale(1.05);
            z-index: 1;
        }

        .days-grid .day-cell.selected .mini-moon {
            color: #0f172a;
        }

        .days-grid .day-cell.new-moon {
            border: 2px solid #fbbf24;
            background: #1a1a2e;
        }

        .days-grid .day-cell .mini-moon {
            font-size: 0.55rem;
            margin-top: 1px;
            color: #64748b;
        }

        .days-grid .day-cell:not(.empty):not(.today):not(.selected):hover {
            background: #1e293b;
            transform: scale(1.05);
        }

        .footer-info {
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid #3d1f6e;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #b8a6d4;
        }

        .footer-info span {
            color: #b8a6d4;
            font-weight: 500;
        }

        .footer-info .highlight {
            color: #fbbf24;
        }

        /* Responsive */
        @media (max-width: 700px) {
            main {
                left: 0;
                top: 100px;
            }
            #nav {
                display: none;
            }
            .calendar-container {
                padding: 1rem;
                margin: 10px auto;
            }
        }

        @media (max-width: 450px) {
            .calendar-header h2 {
                font-size: 0.9rem;
                min-width: 80px;
            }
            .days-grid .day-cell {
                font-size: 0.7rem;
            }
            .days-grid .day-cell .mini-moon {
                font-size: 0.45rem;
            }
            .nav-btn {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            .selected-info .phase-icon {
                font-size: 1.8rem;
            }
            .selected-info .phase-name {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header id="header">
        <div id="logo">
            <h1>Attic Calendar</h1>
        </div>
    </header>
            
    <main>
        <div class="innertube">
            <!-- ===== CALENDARIO ===== -->
            <div class="calendar-container">
                <!-- Header -->
                <div class="calendar-header">
                    <button class="nav-btn" id="prevMonth">◀</button>
                    <h2 id="monthTitle">Hekatombaion</h2>
                    <button class="nav-btn" id="nextMonth">▶</button>
                </div>

                <!-- Día Seleccionado -->
                <div class="selected-info">
                    <div class="date-display">
                        <span id="selectedDate">Selecciona un día</span>
                    </div>
                    <div class="phase-display">
                        <span class="phase-icon" id="selectedPhaseIcon">🌒</span>
                        <div class="phase-details">
                            <div class="phase-name" id="selectedPhaseName">Luna Creciente</div>
                            <div class="phase-sub"></div>
                        </div>
                    </div>
                </div>

                <!-- Días de la semana -->
                <div class="weekdays">
                    <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div>
                    <div>Jue</div><div>Vie</div><div>Sáb</div>
                </div>

                <!-- Grid de días -->
                <div class="days-grid" id="daysGrid"></div>

                <!-- Footer -->
                <div class="footer-info">
                    <div>Month <span id="monthNumber" class="highlight">1</span>/12</div>
                </div>
            </div>
        </div>
    </main>

    <nav id="nav">
        <div class="innertube">
            <h1>Resources:</h1>
            <ul>
                <li><a href="https://www.hellenion.org" target="_blank">Hellenion</a></li>
            </ul>
            <hr style="border-color:#3d1f6e;">
            <div><small>If there are any issues or innacuracies, let us know!</small></div>
            <ul>
                <li><a href="https://discord.gg/jq4zEtCnBT" target="_blank">Our Discord</a></li>
            </ul>
        </div>
    </nav>

    <!-- ===== CARGAR FUNCIONES ===== -->
    <script src="funcionesc.js"></script>
    
    <!-- ===== INICIALIZAR ===== -->
    <script>
        // Esperar a que el DOM esté cargado
        document.addEventListener('DOMContentLoaded', function() {
            initCalendar();
        });

        // Función para actualizar el año en la barra lateral
        function updateYearDisplay() {
            const yearEl = document.getElementById('yearDisplay');
            if (yearEl) {
                yearEl.textContent = currentYear || 1;
            }
        }

        // Sobrescribir funciones de navegación para actualizar el año
        const originalPrev = goToPrevMonth;
        const originalNext = goToNextMonth;
        
        goToPrevMonth = function() {
            originalPrev();
            updateYearDisplay();
        };
        
        goToNextMonth = function() {
            originalNext();
            updateYearDisplay();
        };

        // Actualizar año después de renderizar
        const originalRender = renderCalendar;
        renderCalendar = function() {
            originalRender();
            updateYearDisplay();
        };

        console.log('✅ Attic Calendar cargado correctamente');
    </script>
</body>
</html>
